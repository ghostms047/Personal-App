name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract uploaded project
        run: |
          set -e
          mkdir -p build-src
          unzip -q canvas-ai.zip -d build-src

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          set -e
          ROOT=$(find build-src -type f -name 'settings.gradle*' -print -quit | xargs -r dirname)
          if [ -z "$ROOT" ]; then
            ROOT=$(find build-src -type f -name 'build.gradle*' -print -quit | xargs -r dirname)
          fi
          if [ -z "$ROOT" ]; then
            echo "No Gradle project found in uploaded ZIP."
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Repair missing Android build resources
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: |
          set -e
          STRINGS="app/src/main/res/values/strings.xml"
          mkdir -p "$(dirname "$STRINGS")"
          cat > "$STRINGS" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Personal App</string>
              <string name="notification_channel_name">Personal App Reminders</string>
              <string name="notification_channel_description">Personal App reminder notifications</string>
              <string name="canvas_empty_hint">Ask Personal AI to build something.</string>
              <string name="chat_placeholder">Ask Personal AI...</string>
              <string name="settings_title">Settings</string>
              <string name="welcome_title">Personal App</string>
              <string name="welcome_subtitle">Build your own workspace with AI.</string>
              <string name="history_title">History</string>
              <string name="pages_title">Pages</string>
          </resources>
          EOF

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.root }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e
          APK=$(find "${{ steps.locate.outputs.root }}" -type f -name '*.apk' -path '*/build/outputs/apk/*' -print -quit)
          if [ -z "$APK" ]; then
            echo "No APK was produced."
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Personal-App-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
